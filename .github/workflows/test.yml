name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'  # Daily at 3:23 AM (off-peak)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 关掉 fail-fast：lint、protocol-check、覆盖率和 E2E 只在 Node 20 那条腿上跑，
      # 默认的 fail-fast 会让 Node 22 的任何抖动顺手取消 Node 20，红叉背后是所有真门禁一条没跑。
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex
        if: matrix.node-version == 20
        run: npm i -g @openai/codex@$(cat .codex-version)

      - name: Check app-server protocol
        if: matrix.node-version == 20
        run: npm run protocol:check

      - name: Lint
        if: matrix.node-version == 20
        run: npm run lint

      - name: Check import boundaries
        if: matrix.node-version == 20
        run: node scripts/gates/check-import-boundaries.js

      - name: Check invariant ids
        if: matrix.node-version == 20
        run: node scripts/gates/check-invariant-ids.js

      - name: Run tests
        run: npm test

      # 只在 Node 20 上跑：产物只从 Node 20 上传，Node 22 那份没有任何步骤消费，
      # 却是最重的一步（c8 插桩 + 默认并发的全量测试）。跑在一条本来就常被 runner
      # 回收的腿上纯属浪费。
      - name: Run coverage
        if: matrix.node-version == 20
        run: npm run coverage

      # 退化门禁（相对基线跌幅 ≤2pp）已经包含 check-coverage.js 的绝对阈值
      # （80/60/80/80 两处相同），后者是它的真子集，不再单独跑一遍插桩全量。
      # 而 fast-forward 合并走的是 push 路径 —— 只在 PR 上跑等于给自己留后门。
      - name: Check coverage delta
        if: matrix.node-version == 20
        run: node scripts/gates/check-coverage-delta.js

      - name: Install Playwright browsers
        if: matrix.node-version == 20
        # webkit 是 playwright.config.js 里 mobile-webkit project 的引擎。产品主设备是
        # 手机，只装 chromium 等于 iOS 侧零覆盖；漏装的症状是 E2E 报
        # "Executable doesn't exist"，读起来像配置坏了而不像少装了浏览器。
        #
        # --with-deps 不能省：runner 镜像自带 chromium 要的系统库，但没有 webkit 要的
        # libgtk-4 / libgraphene / libevent / libopus / libgst*。缺它们时浏览器二进制
        # 装得上、启动即失败（"Host system is missing dependencies"），每条用例 3-4ms
        # 就红——看起来像用例写坏了，其实一次都没跑起来。webkit 自 6dee6bb 加进矩阵后
        # 整条腿从未真正执行过，而这一直被前面单测的红挡着，直到 2026-09-13 才显形。
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        if: matrix.node-version == 20
        run: npx playwright test

      # 失败那一次的现场只存在于 runner 上。playwright.config.js 配了
      # screenshot: only-on-failure 与 trace: on-first-retry，产物落在 test-results/，
      # 不上传就随容器销毁 —— 线上失败只剩一行断言文本。
      # 条件必须是 failure() 而不是默认：默认只在前面步骤全绿时执行，而现场只在失败时才有。
      - name: Upload Playwright failure artifacts
        if: ${{ failure() && matrix.node-version == 20 }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 阻断门禁：只看运行时依赖。本服务的传输层就是 socket.io，
      # 运行时依赖里的高危漏洞直接暴露在网络边界上，必须让构建变红。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # 咨询性：devDependencies 的漏洞（eslint/playwright 之类）不上生产，
      # 不阻断构建，但报告要留成产物 —— 否则等于没跑。
      - name: Audit all dependencies (advisory)
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 7
