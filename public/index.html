<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Codex">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <!-- 代码块底色改成跟随主题（app.css 的 --code-surface：浅色 #ececec / 深色 #1e1e1e）后，
       hljs 主题必须跟着切——github-dark 的前景色是为 #0d1117 挑的，压在浅底上读不了。
       media 查询让浏览器只对当前配色的那份计算样式，切换是即时的，不需要 JS。 -->
  <link rel="stylesheet" href="/vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/app.css">
  <title>Codex Chat</title>
</head>
<body>

<!-- Token auth screen -->
<div id="auth-gate" class="show" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <form id="auth-form" autocomplete="off">
    <h2 id="auth-title">输入访问口令</h2>
    <p>使用服务器 `.env` 里的 AUTH_TOKEN。首次通过后会保存在当前浏览器。</p>
    <input id="auth-token-input" type="password" placeholder="AUTH_TOKEN" autocomplete="current-password">
    <button id="auth-submit" type="submit">连接</button>
    <p id="auth-error" role="alert"></p>
  </form>
</div>

<!-- Device auth waiting screen -->
<div id="device-auth">
  <h2><span data-icon="hourglass"></span> 等待设备授权</h2>
  <p>请在服务器端按<strong>回车键</strong>批准此设备，或运行：</p>
  <div id="device-id-display"></div>
  <p style="font-size:12px;color:var(--text-muted)">node scripts/device.js approve &lt;ID&gt;</p>
</div>

<!-- Session drawer -->
<div id="drawer-overlay"></div>
<div id="drawer" aria-labelledby="drawer-title">
  <div id="drawer-header">
    <h2 id="drawer-title">工作区与会话</h2>
    <button type="button" id="drawer-close" title="关闭" aria-label="关闭">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <!-- 固定在滚动区之外:归档会话的唯一回路,不能被长会话列表滚走。 -->
  <div id="drawer-archived-bar">
    <button type="button" id="drawer-archived-toggle" aria-pressed="false" title="在未归档与已归档会话之间切换">
      <span class="drawer-archived-icon" data-icon="archive"></span>
      已归档
    </button>
  </div>
  <div id="drawer-body">
    <div id="drawer-projects"></div>
  </div>
  <button id="btn-general-settings" type="button" title="本机偏好、账号与主机状态" aria-label="打开设置与状态">
    <span class="drawer-section-icon" data-icon="gear"></span>
    <span>设置与状态</span>
    <span class="settings-entry-chevron">›</span>
  </button>
</div>

<!-- 设置与状态。与底栏的会话设置(#session-settings)按**作用域**分开：那边是
     model·permission·effort，换台设备打开同一会话仍然成立；这边是本机偏好与主机状态，
     换台设备就该重新选。两者混在一起用户会找不到开关。 -->
<div id="settings-sheet-overlay" hidden></div>
<div id="settings-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settings-sheet-title">
  <div id="settings-sheet-header">
    <h2 id="settings-sheet-title">设置与状态</h2>
    <button type="button" id="settings-sheet-close" title="关闭" aria-label="关闭设置">
      <span class="drawer-section-icon" data-icon="x"></span>
    </button>
  </div>
  <div id="settings-sheet-body">
    <section class="settings-group">
      <h3 class="settings-group-title">账号与主机</h3>
      <div class="settings-actions">
        <button id="native-account-btn" class="settings-action-btn" title="账号与用量">账号</button>
        <button id="native-mcp-btn" class="settings-action-btn" title="MCP 状态">MCP</button>
        <button id="native-health-btn" class="settings-action-btn" title="连接与运行诊断">诊断</button>
        <button id="native-devices-btn" class="settings-action-btn" title="已接入的设备">设备</button>
        <button id="native-skills-btn" class="settings-action-btn" title="已加载的技能">技能</button>
        <button id="native-import-btn" class="settings-action-btn" title="导入 AGENTS/CLAUDE 配置">导入</button>
        <button id="push-subscribe-btn" type="button" class="settings-action-btn" hidden>开启推送通知</button>
      </div>
    </section>
    <section class="settings-group">
      <h3 class="settings-group-title">危险操作</h3>
      <div class="settings-actions">
        <button id="native-host-config-btn" class="settings-action-btn native-danger" title="宿主配置：改动 Codex 配置、插件与账号">宿主配置</button>
      </div>
    </section>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div class="header-left">
    <button type="button" id="menu-btn" class="header-icon-btn" title="会话与项目" aria-label="打开会话列表">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.75 5.75A1.75 1.75 0 016.5 4h11A1.75 1.75 0 0119.25 5.75v12.5A1.75 1.75 0 0117.5 20h-11a1.75 1.75 0 01-1.75-1.75V5.75z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 4v16M12.5 8h3.75M12.5 12h3.75M12.5 16h2.5" />
      </svg>
    </button>
    <span id="conn-rtt" hidden title="手机到主机的往返延迟" aria-live="polite"></span>
  </div>

  <div class="header-center">
    <button type="button" id="header-context" title="浏览工作区文件和改动">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
      </svg>
      <span id="header-project">项目</span>
      <span id="header-thread" hidden></span>
      <span id="header-changes" hidden></span>
      <span class="header-pill-chevron" aria-hidden="true">›</span>
    </button>
  </div>
  <span id="thread-title">新会话</span>
  <span id="state-label">offline</span>
  <div id="session-meta">connecting...</div>
  <div id="status-detail"></div>

  <div class="header-right">
    <div id="workdir-container" hidden>
      <select id="workdir-select"></select>
    </div>
    <button type="button" id="header-new" class="header-icon-btn" title="空白草稿" aria-label="空白草稿">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>
  </div>

  <!-- Legacy fields hidden but preserved for original JS synchronization -->
  <input type="text" id="model-input" placeholder="model" style="display:none;">
  <select id="perm-select" style="display:none;">
    <option value="untrusted">untrusted</option>
    <option value="on-request">on-request</option>
    <option value="never">never</option>
  </select>
</div>

<div id="conn-banner" hidden role="status" data-testid="conn-banner">
  <span id="conn-banner-spinner" hidden aria-hidden="true" data-icon="gear"></span>
  <span id="conn-banner-text"></span>
  <span id="conn-banner-detail"></span>
  <button type="button" id="conn-banner-retry" hidden>立即重试</button>
</div>

<!-- Pending devices panel -->
<div id="pending-panel"></div>

<!-- Cross-thread approvals and questions -->
<div id="needs-you-panel" hidden aria-live="polite"></div>

<div id="native-panel" class="sheet-overlay" hidden role="dialog" aria-modal="true"></div>

<!-- Messages Container -->
<div id="messages" aria-live="off"></div>
<div id="turn-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Empty State Landing Screen -->
<div id="empty-state" class="empty-state">
  <h1 id="empty-heading" class="empty-heading">这轮改什么？</h1>
  <p id="empty-project" class="empty-project" hidden></p>
  <div id="empty-actions" class="suggestions-grid"></div>
</div>

<div id="at-mention-popup" hidden></div>

<!-- Slash Autocomplete Popup：条目由 SLASH_ACTIONS 在运行时生成 -->
<div id="slash-popup" class="slash-popup"></div>

<!-- Attachment tray -->
<div id="attach-tray" hidden></div>

<!-- Bottom Input Bar -->
<div id="input-area">
  <button type="button" id="jump-to-latest" aria-label="查看最新消息" hidden>有新内容 ↓</button>
  <div id="msg-input-container">
    <textarea id="msg-input" placeholder="描述要改的代码" rows="1"></textarea>
    <div class="input-controls-row">
      <div id="composer-chips" class="composer-chips">
        <button type="button" id="composer-defaults" data-testid="composer-defaults" title="会话设置">
          <span id="model-trigger" hidden>
            <span id="model-trigger-text" class="pill-part"></span>
          </span>
          <span id="mode-trigger" hidden>
            <span class="composer-sep" aria-hidden="true">·</span>
            <span id="mode-trigger-text" class="pill-part"></span>
          </span>
          <span class="composer-sep" id="perm-leading-sep" aria-hidden="true" hidden></span>
          <span id="perm-trigger-text" class="pill-part">权限</span>
          <span id="effort-trigger" hidden>
            <span class="composer-sep" aria-hidden="true">·</span>
            <span id="effort-trigger-text" class="pill-part"></span>
          </span>
        </button>
      </div>
      <div class="composer-actions">
        <!-- 上下文用量：圆环 + 点开的数字气泡。环的形状抄 ChatGPT 的
             composer.contextUsageIndicator，但数字不能学它放 title——触屏没有
             hover，title 在 iOS Safari / Android Chrome 上永远弹不出来，
             那等于把数字删了。这里换成 tap 展开。 -->
        <button id="context-meter" data-testid="context-meter" type="button"
                aria-controls="context-meter-detail" aria-expanded="false" hidden></button>
        <button id="attach-btn" type="button" title="附件" aria-label="添加附件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
          </svg>
        </button>
        <button id="followup-btn" type="button" title="中断" aria-label="中断" hidden>
          <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-6.5 6.5M12 5l6.5 6.5" />
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" />
          </svg>
        </button>
        <div id="send-btn-container" hidden>
          <button id="send-btn" data-mode="send" title="发送" aria-label="发送" hidden disabled>
            <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-6.5 6.5M12 5l6.5 6.5" />
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2" />
            </svg>
          </button>
        </div>
      </div>
      <!-- 点 #context-meter 弹出的具体数字。挂在输入框卡片上（absolute，不占布局），
           浮在卡片外侧上方——放在控件行正上方会盖住用户正在打的字。 -->
      <span id="context-meter-detail" data-testid="context-meter-detail" hidden></span>
    </div>
  </div>
</div>

<div id="session-settings" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="session-settings-title">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="workspace-tabs">
      <div id="session-settings-title" class="sheet-title" style="margin:0;">会话设置</div>
      <button type="button" id="session-settings-close" class="native-mini-btn" style="margin-left:auto">关闭</button>
    </div>
    <div id="session-settings-body" class="workspace-body" style="padding-bottom:8px;">
      <div class="popover-section-label">如何批准操作</div>
      <div class="popover-list" id="permission-list"></div>
      <p id="permission-state" role="status"></p>
      <div class="popover-section-label">模型</div>
      <div class="popover-list model-list settings-grid-2" id="model-list"></div>
      <div class="popover-section-label bordered">思考强度</div>
      <div class="popover-list reasoning-list settings-wrap-row" id="reasoning-list"></div>
      <div class="popover-section-label bordered" id="speed-section-label">速度</div>
      <div class="popover-list speed-list settings-wrap-row" id="speed-list"></div>
      <details id="settings-advanced">
      <summary class="popover-section-label bordered">高级设置</summary>
      <div class="popover-section-label">审批策略</div>
      <div class="popover-list settings-grid-3" id="approval-list"></div>
      <div class="popover-section-label">由谁审批</div>
      <div class="popover-list settings-grid-2" id="reviewer-list"></div>
      <div class="popover-section-label bordered">细粒度审批 <span class="label-sub">granular</span></div>
      <div class="popover-list settings-grid-2" id="granular-list"></div>
      <div class="popover-section-label bordered">沙箱环境 <span class="label-sub">-s / --sandbox</span></div>
      <div class="popover-list settings-grid-3" id="sandbox-list"></div>
      <div class="popover-section-label">当前生效配置</div>
      <p id="permission-effective" class="permission-effective"></p>
      </details>
    </div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" multiple hidden>

<div id="confirm-modal" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div id="confirm-title" class="sheet-title"></div>
    <div id="confirm-body" class="sheet-body"></div>
    <div id="confirm-input-wrap" hidden>
      <input id="confirm-input" type="text" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button type="button" id="confirm-cancel">取消</button>
      <button type="button" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- 会话操作菜单：长按抽屉里的会话条目拉起。这些操作过去是三个常驻按钮，
     把每条会话撑到约 100px；收进菜单后条目只剩标题和时间。
     复用 .sheet-* 那套类，连 z-index 150（压住抽屉）一起继承。 -->
<div id="thread-menu" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="thread-menu-title">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div id="thread-menu-title" class="sheet-title"></div>
    <div class="sheet-menu">
      <button type="button" data-action="rename">重命名</button>
      <button type="button" data-action="compact">压缩上下文</button>
      <button type="button" data-action="rollback">回退</button>
      <button type="button" id="thread-menu-unread" data-action="toggle-unread">标为未读</button>
      <button type="button" id="thread-menu-archive" data-action="archive">归档</button>
      <button type="button" data-action="delete" class="sheet-menu-danger">删除</button>
    </div>
    <div class="sheet-actions">
      <button type="button" id="thread-menu-cancel">取消</button>
    </div>
  </div>
</div>

<div id="workspace-modal" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-label="工作区">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="workspace-tabs">
      <button type="button" id="workspace-tab-files" class="workspace-tab active">文件</button>
      <button type="button" id="workspace-tab-changes" class="workspace-tab">改动</button>
      <button type="button" id="workspace-close" class="native-mini-btn" style="margin-left:auto">关闭</button>
    </div>
    <div id="workspace-files-tools" class="workspace-tools">
      <button type="button" id="file-browse-back" class="native-mini-btn" hidden>←</button>
      <div id="file-browse-path" class="workspace-empty" style="padding:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
    </div>
    <div id="workspace-git-tools" class="workspace-tools" hidden>
      <div id="git-changes-branch" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;"></div>
      <button type="button" id="git-changes-refresh" class="native-mini-btn">刷新</button>
    </div>
    <div id="file-browse-body" class="workspace-body"></div>
    <div id="git-changes-body" class="workspace-body" hidden></div>
  </div>
</div>

<div id="attach-preview-modal" hidden role="dialog" aria-modal="true" aria-label="附件预览">
  <img id="attach-preview-img" alt="附件预览">
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
